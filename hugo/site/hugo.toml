baseURL = 'http://localhost:1313/'
languageCode = 'en-us'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
title = 'Anthem World - National Anthems of the World'

[languages]
  [languages.en]
    languageCode = 'en-us'
    languageName = 'English'
    weight = 1
    [languages.en.params]
      description = "Explore the national anthems of all 193 UN-recognized countries through an interactive map, searchable country pages, and Anthem Battle rankings."
  [languages.es]
    languageCode = 'es-es'
    languageName = 'Español'
    weight = 2
    [languages.es.params]
      description = "Explora los himnos nacionales de los 193 países reconocidos por la ONU mediante un mapa interactivo, páginas de países y clasificaciones de Anthem Battle."
  [languages.zh-cn]
    languageCode = 'zh-CN'
    languageName = '简体中文'
    weight = 3
    [languages.zh-cn.params]
      description = "通过互动地图、国家页面和国歌对战排名，探索联合国193个会员国的国歌。"

[params]
  description = "Explore the national anthems of all 193 UN-recognized countries through an interactive world map"
  author = "Anthem World"
  # Game API base URL — empty disables the Top 3 widget fetch.
  # Set to "http://localhost:3001" in config.local.toml for local SAM dev.
  gameApiBase = ""

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
