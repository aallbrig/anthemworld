{{ define "title" }}{{ i18n "countries_page_title" }} — {{ .Site.Title }}{{ end }}

{{ define "main" }}
<div class="container my-5">
  <div class="mb-4">
    <h1>{{ i18n "countries_heading" }}</h1>
    <p class="lead">{{ i18n "countries_lead" }}</p>
  </div>

  <div class="table-responsive">
    <table id="countries-table" class="table table-striped table-bordered" style="width:100%">
      <thead>
        <tr>
          <!-- 10 columns: DataTables will populate titles from columns[] config -->
          <th></th><th></th><th></th><th></th><th></th><th></th><th></th><th></th><th></th><th></th>
        </tr>
      </thead>
      <tbody>
        <!-- Populated by countries-table.js after jQuery + DataTables load -->
      </tbody>
    </table>
  </div>
</div>
{{ end }}

{{ define "scripts" }}
<script src="{{ "js/countries-table.js" | relURL }}"></script>
{{ end }}
