{{ define "main" }}
<div class="container my-5">

{{ define "scripts" }}

<script>

    var el = document.getElementById('home-top3');

  }());
</script>
{{ end }}
<script src="{{ "js/home-stats.js" | relURL }}"></script>
{{ end }}
