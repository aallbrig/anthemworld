AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Anthem World Game Service — ELO anthem ranking game

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        RANKINGS_TABLE:  !Ref RankingsTable
        VOTES_TABLE:     !Ref VotesTable
        SESSIONS_TABLE:  !Ref SessionsTable
        LISTEN_TABLE:    !Ref ListenHistoryTable
        MAX_VOTES_PER_SESSION: "100"
        MAX_SESSIONS_PER_IP:   "5"
        MAX_MATCHUPS_PER_SESSION: "300"
        CORS_ORIGIN:     !Ref CorsOrigin
        LOCAL_DYNAMODB_ENDPOINT: ""
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"
        AWS_REGION_OVERRIDE: ""  # placeholder so env.local.json can set AWS_REGION

Parameters:
  Stage:
    Type: String
    Default: local
    AllowedValues: [local, dev, prod]
  CorsOrigin:
    Type: String
    Default: "*"
    Description: Allowed CORS origin (set to your domain in production)

Resources:

  # ── API Gateway Logging ────────────────────────────────────────────────────
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/anthemworld-game-${Stage}"
      RetentionInDays: 30

  # ── API Gateway ────────────────────────────────────────────────────────────
  GameApi:
    Type: AWS::Serverless::Api
    DependsOn: ApiGatewayAccount
    Properties:
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Session-Id'"
        AllowOrigin: !Sub "'${CorsOrigin}'"
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
      # S-02: Throttle all routes to prevent DDoS / cost runaway
      MethodSettings:
        - HttpMethod: '*'
          ResourcePath: '/*'
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 100
          MetricsEnabled: true
          LoggingLevel: ERROR

  # ── Lambda Functions ────────────────────────────────────────────────────────
  SessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: session/index.handler
      Description: Create or validate an anonymous game session
      Events:
        CreateSession:
          Type: Api
          Properties:
            RestApiId: !Ref GameApi
            Path: /session
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable

  MatchupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: matchup/index.handler
      Description: Return the next ELO-matched anthem pair for a session
      Events:
        GetMatchup:
          Type: Api
          Properties:
            RestApiId: !Ref GameApi
            Path: /matchup
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref RankingsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ListenHistoryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable

  VoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: vote/index.handler
      Description: Submit a vote, validate listen requirements, update ELO
      Events:
        SubmitVote:
          Type: Api
          Properties:
            RestApiId: !Ref GameApi
            Path: /vote
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VotesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RankingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ListenHistoryTable

  LeaderboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: leaderboard/index.handler
      Description: Return paginated ELO leaderboard
      Events:
        GetLeaderboard:
          Type: Api
          Properties:
            RestApiId: !Ref GameApi
            Path: /leaderboard
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RankingsTable
        - DynamoDBReadPolicy:
            TableName: !Ref VotesTable

  ListenFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: listen/index.handler
      Description: Ingest client-side listen progress events
      Events:
        PostListen:
          Type: Api
          Properties:
            RestApiId: !Ref GameApi
            Path: /listen
            Method: POST
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref RankingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ListenHistoryTable

  WeeklyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: weekly/index.handler
      Description: Return weekly round winners and vote statistics
      Events:
        GetWeekly:
          Type: Api
          Properties:
            RestApiId: !Ref GameApi
            Path: /weekly
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref VotesTable
        - DynamoDBReadPolicy:
            TableName: !Ref RankingsTable

  # ── DynamoDB Tables ─────────────────────────────────────────────────────────
  RankingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "anthem-rankings-${Stage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: country_id
          AttributeType: S
      KeySchema:
        - AttributeName: country_id
          KeyType: HASH

  VotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "anthem-votes-${Stage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: vote_id
          AttributeType: S
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: voted_at
          AttributeType: S
      KeySchema:
        - AttributeName: vote_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: session-votes-index
          KeySchema:
            - AttributeName: session_id
              KeyType: HASH
            - AttributeName: voted_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "anthem-sessions-${Stage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: ip_hash
          AttributeType: S
        - AttributeName: created_date
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ip-sessions-index
          KeySchema:
            - AttributeName: ip_hash
              KeyType: HASH
            - AttributeName: created_date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ListenHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "anthem-listen-history-${Stage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: pk   # session_id#country_id
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── CloudWatch Alarms ────────────────────────────────────────────────────────
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "anthemworld-${Stage}-api-5xx"
      AlarmDescription: "API Gateway 5xx errors exceeded threshold"
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Ref GameApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  Api4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "anthemworld-${Stage}-api-4xx"
      AlarmDescription: "API Gateway 4xx errors exceeded threshold (possible abuse)"
      Namespace: AWS/ApiGateway
      MetricName: 4XXError
      Dimensions:
        - Name: ApiName
          Value: !Ref GameApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 100
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ApiLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "anthemworld-${Stage}-api-latency"
      AlarmDescription: "API Gateway p99 latency exceeded 5 seconds"
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiName
          Value: !Ref GameApi
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  LambdaErrorAlarmVote:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "anthemworld-${Stage}-lambda-vote-errors"
      AlarmDescription: "Vote function errors (critical path)"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref VoteFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  LambdaErrorAlarmSession:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "anthemworld-${Stage}-lambda-session-errors"
      AlarmDescription: "Session function errors (critical path)"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SessionFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ── WAF (API Gateway) ──────────────────────────────────────────────────────
  ApiWafWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "anthemworld-api-${Stage}"
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "anthemworld-api-${Stage}"
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              ExcludedRules:
                - Name: SizeRestrictions_BODY
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "anthemworld-api-${Stage}-common"
        - Name: RateLimitPerIP
          Priority: 2
          Statement:
            RateBasedStatement:
              Limit: 1000
              AggregateKeyType: IP
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "anthemworld-api-${Stage}-ratelimit"

  ApiWafAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/${GameApi}/stages/${Stage}"
      WebACLArn: !GetAtt ApiWafWebAcl.Arn

Outputs:
  GameApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${GameApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  LocalApiUrl:
    Description: Local SAM/LocalStack URL
    Value: "http://localhost:3001"
