AWSTemplateFormatVersion: '2010-09-09'
Description: Anthem World — CloudFront WAF (must be deployed in us-east-1)

Resources:
  CloudFrontWafWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: anthemworld-cloudfront
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: anthemworld-cloudfront
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: anthemworld-cf-common
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 2
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: anthemworld-cf-bad-inputs
        - Name: RateLimitPerIP
          Priority: 3
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: anthemworld-cf-ratelimit

Outputs:
  WebAclArn:
    Description: WAF WebACL ARN (CLOUDFRONT scope)
    Value: !GetAtt CloudFrontWafWebAcl.Arn
