# Raw Prometheus — scrapes the OTel Collector's Prometheus exposition (pull
# model) plus its own metrics. No remote-write, no Mimir.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          service: anthemworld-game

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
