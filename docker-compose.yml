services:
  localstack:
    image: localstack/localstack:3
    container_name: anthemworld-localstack
    ports:
      - "4566:4566"        # LocalStack gateway (DynamoDB, S3, etc.)
    environment:
      - SERVICES=dynamodb
      - DEFAULT_REGION=us-east-1
      - DEBUG=0
      - PERSISTENCE=1      # persist state across restarts
      - LOCALSTACK_DATA_DIR=/var/lib/localstack/data
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Observability stack (LGTM + raw Prometheus) ────────────────────────────
  # Started only with the "observability" profile:
  #     docker compose --profile observability up -d   (or: task obs:up)
  # These share the anthemworld_default network, so SAM-local Lambdas reach the
  # collector at otel-collector:4318.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: anthemworld-otel-collector
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      # Host-published ports default to the standard values but can be overridden
      # (e.g. OTLP_HTTP_PORT=4319) if another stack already owns them. In-network
      # wiring always uses the container ports, so overrides don't affect Lambdas.
      - "${OTLP_HTTP_PORT:-4318}:4318"   # OTLP/HTTP (in-network: otel-collector:4318)
      - "${OTLP_GRPC_PORT:-4317}:4317"   # OTLP/gRPC
      - "${OTELCOL_PROM_PORT:-8889}:8889"   # Prometheus exposition (scraped)
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: anthemworld-prometheus
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=72h"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  tempo:
    image: grafana/tempo:2.7.0
    container_name: anthemworld-tempo
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"   # Tempo query API

  loki:
    image: grafana/loki:3.3.2
    container_name: anthemworld-loki
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: anthemworld-grafana
    profiles: ["observability"]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  localstack_data:
  prometheus_data:
  tempo_data:
  loki_data:
  grafana_data:
